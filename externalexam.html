<!DOCTYPE html>
<html>
<head>
    <title>Sum of 1 to N</title>
</head>
<body>

<h2>Sum of Numbers from 1 to N</h2>

<script>
let n = parseInt(prompt("Enter a number:"));
let sum = 0;

for (let i = 1; i <= n; i++) {
sum = sum + i;
}

alert("Sum of numbers from 1 to " + n + " is: " + sum);
document.write("Sum of numbers from 1 to " + n + " is: " + sum);
</script>

</body>
</html>
